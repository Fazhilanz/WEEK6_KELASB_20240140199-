<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum JS</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <h1>Praktikum JS</h1>
        <!-- FETCH API -->
        <section id="BagianProduk">
            <h2>1. data produk</h2>
            <p id="StatusProduk" hidden></p>
            <div id="DaftarProduk"></div>
        </section>
    </main>

    <!-- FORM-->
         <section id="bagianform">
            <h2>2. Form Pemesanan</h2>

            <form id="form pemesanan" novalidate>
                <div class="form-group">
                    <label for="namapemesan">Nama Pemesan</label>
                    <input type="text" id="namapemesan" placeholder="Contoh: Pajil">
                    <small class="error-text" id="errornama"> </small>
                </div>

                <div class="form-group">
                    <label for="inputproduk">Nama Produk</label>
                    <input type="text" id="inputproduk" placeholder="Contoh: Red Lipstick">
                    <small class="error-text" id="errorproduk"></small>
                </div>

                <div class="form-group">
                    <label for="inputjumlah">Jumlah</label>
                    <input type="number" id="inputjumlah" min="1">
                    <small class= 'error-text' id="errorjumlah"></small>
                </div>

                <button type="submit">pesan</button>
    
            </form>

            <div id="hasilpesanan" hidden></div>
         </section>

    <script src="index.js"></script>
</body>
</html>
